# Nginx site config for Vuvoz (Gunicorn on 127.0.0.1:8000).
# Copy to server: sudo cp deploy/nginx-vuvoz-site.conf /etc/nginx/sites-available/vuvoz
# Then: sudo ln -sf /etc/nginx/sites-available/vuvoz /etc/nginx/sites-enabled/
#       sudo nginx -t && sudo systemctl reload nginx
#
# Replace PROJECT_ROOT with your project path (e.g. /var/www/vuvoz/vuvoz).
# Replace DOMAIN with your domain (e.g. zeleniyschet.online).

upstream backend {
    server 127.0.0.1:8000;
}

server {
    listen 80;
    server_name zeleniyschet.online www.zeleniyschet.online;
    client_max_body_size 10M;

    location /static/ {
        alias /var/www/vuvoz/vuvoz/staticfiles/;
    }

    location /media/ {
        alias /var/www/vuvoz/vuvoz/media/;
    }

    location /api/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
        proxy_connect_timeout 10;
        proxy_send_timeout 120;
    }

    location /admin/ {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120;
    }

    location / {
        proxy_pass http://backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_intercept_errors on;
        error_page 404 = /index.html;
    }
}
